task: 'treescorer'

env:
  num_threads: 16
  seed: 42

dataset:
  name: 'chatdoctor5k'
  text_encoder_name: 'gte-large-en-v1.5'

treescorer:
  max_hops: 3
  max_paths_per_root: 200
  max_paths_per_sample: 1000
  add_reverse_edges: true
  hidden_size: 256
  num_layers: 2
  heads: 1
  max_neg_per_pos: 10
  max_neg_per_sample: 60
  use_cache: true
  cache_version: 'v3'

optimizer:
  lr: 1e-4

eval:
  k_list: '1,3,5'

train:
  num_epochs: 20
  patience: 3
  batch_size: 8
  save_prefix: 'chatdoctor5k_tree'
