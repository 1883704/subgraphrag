task: 'treescorer'

env:
  num_threads: 16
  seed: 42

dataset:
  name: 'medmcqa_primekg'
  text_encoder_name: 'gte-large-en-v1.5'

treescorer:
  max_hops: 3
  max_paths_per_root: 200
  max_paths_per_sample: 1000
  add_reverse_edges: true
  hidden_size: 256
  num_layers: 2
  heads: 1
  max_neg_per_pos: 10
  max_neg_per_sample: 60
  use_cache: true
  cache_version: 'v3'

optimizer:
  lr: 1e-4
  weight_decay: 1e-5

eval:
  k_list: '1,3,5'

train:
  num_epochs: 50
  patience: 8
  batch_size: 8
  monitor_metric: 'mrr'
  min_delta: 0.0005
  grad_clip_norm: 1.0
  lr_scheduler_factor: 0.5
  lr_scheduler_patience: 2
  save_prefix: 'medmcqa_primekg_tree'
