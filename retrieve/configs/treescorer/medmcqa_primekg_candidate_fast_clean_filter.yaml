task: candidate_treescorer

env:
  num_threads: 8
  seed: 42

dataset:
  name: medmcqa_primekg
  text_encoder_name: gte-large-en-v1.5
  label_base: zero
  num_options: 4

candidate_treescorer:
  max_hops: 2
  max_paths_per_root: 50
  max_paths_per_sample: 80
  max_paths_per_candidate: 8
  max_pos_per_candidate: 4
  max_hard_neg_per_candidate: 4
  add_reverse_edges: true
  hidden_size: 256
  num_layers: 2
  heads: 2
  dropout: 0.2
  use_cache: false
  cache_version: candidate_v2_fast_clean_filter
  filter_generic_entities: true
  min_entity_text_len: 1
  max_entity_degree: 80
  generic_entity_stoplist:
    - all
    - patient
    - patients
    - disease
    - diseases
    - medicine
    - medical
    - treatment
    - therapy
    - drug
    - drugs
    - human
    - normal
    - abnormal
    - positive
    - negative
    - clinical
    - surgery
    - procedure
    - syndrome
    - disorder
    - condition
    - finding
    - symptom
    - sign
    - test
    - diagnosis
    - management
    - cause
    - risk
    - factor
    - complication
    - effect
    - unknown
    - various
    - multiple
    - common
    - rare

optimizer:
  lr: 1.0e-4
  weight_decay: 1.0e-5

loss:
  aggregate_mode: max
  option_loss_weight: 1.0
  support_loss_weight: 0.2

eval:
  k_list: 1,3,5

train:
  num_epochs: 10
  patience: 3
  batch_size: 4
  monitor_metric: option_acc
  min_delta: 0.0005
  grad_clip_norm: 1.0
  lr_scheduler_factor: 0.5
  lr_scheduler_patience: 2
  wandb_mode: disabled
  save_prefix: medmcqa_primekg_candidate_tree_fast_clean_filter
